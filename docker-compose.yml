# Self-hosted Prowexa: app (site + API) and PostgreSQL.
# Host nginx proxies prowexa.com -> 127.0.0.1:3000 and terminates SSL.
name: prowexa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prowexa
      POSTGRES_USER: prowexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prowexa -d prowexa"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prowexa:${POSTGRES_PASSWORD}@db:5432/prowexa
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
